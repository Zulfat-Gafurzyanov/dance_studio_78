server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API to backend
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Static files — clean URLs (without .html)
    # rewrite is inside location / so it doesn't affect error_page internal redirects
    location / {
        rewrite ^(.+)\.html$ $1 permanent;
        try_files $uri $uri.html $uri/ =404;
    }

    # Custom error pages
    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;
    error_page 502 503 504 /errors/503.html;

    location = /errors/404.html { internal; }
    location = /errors/500.html { internal; }
    location = /errors/503.html { internal; }

    # Security headers
    add_header X-Frame-Options      "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"   always;
    add_header Referrer-Policy      "strict-origin-when-cross-origin" always;

    # Cache static assets
    location ~* \.(css|js|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
