<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — Студия 78</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav id="nav"></nav>

<div class="container">
    <div class="page-header">
        <div class="page-label">Аккаунт</div>
        <h1>ПРОФИЛЬ</h1>
    </div>

    <div class="grid-2">
        <div class="card">
            <h2>Данные аккаунта</h2>
            <form id="form-profile">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" id="profile-email">
                </div>
                <div class="form-group">
                    <label>Новый пароль</label>
                    <input type="password" name="password" placeholder="Оставьте пустым чтобы не менять">
                </div>
                <button class="btn btn-primary">Сохранить</button>
            </form>
        </div>

        <div class="card">
            <h2>Опасная зона</h2>
            <p style="font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.7">
                Удаление аккаунта необратимо.<br>Все данные будут потеряны.
            </p>
            <button id="btn-delete" class="btn btn-danger">Удалить аккаунт</button>
        </div>
    </div>
</div>

<script type="module">
import { api } from "./js/api.js";
import { requireAuth, clearTokens, renderNav, showAlert, showConfirm } from "./js/utils.js";

requireAuth();
renderNav();

const container = document.querySelector(".container");

api.getMe().then(user => {
    document.getElementById("profile-email").value = user.email ?? "";
}).catch(err => showAlert(container, err.message));

document.getElementById("form-profile").addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = {};
    const email = e.target.email.value;
    const password = e.target.password.value;
    if (email) body.email = email;
    if (password) body.password = password;
    try {
        await api.updateMe(body);
        showAlert(container, "Профиль обновлён", "success");
    } catch (err) {
        showAlert(container, err.message);
    }
});

document.getElementById("btn-delete").addEventListener("click", async () => {
    if (!await showConfirm("Аккаунт будет удалён безвозвратно. Это действие нельзя отменить.", "Удалить аккаунт?")) return;
    try {
        await api.deleteMe();
        clearTokens();
        window.location.href = "auth.html";
    } catch (err) {
        showAlert(container, err.message);
    }
});
</script>
</body>
</html>
