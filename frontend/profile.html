<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — Студия 78</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/landing.css">
</head>
<body style="display:flex;flex-direction:column;min-height:100vh">

<nav id="nav"></nav>

<div class="container" style="flex:1;padding-top:110px">
    <div class="page-header">
        <div class="page-label">Аккаунт</div>
        <h1>ПРОФИЛЬ</h1>
    </div>

    <div class="grid-2">
        <div class="card">
            <h2>Данные аккаунта</h2>
            <div class="profile-meta" id="profile-meta" style="margin-bottom:20px;display:none">
                <div class="profile-meta-row">
                    <span class="contact-label">Роль</span>
                    <span id="profile-role">—</span>
                </div>
                <div class="profile-meta-row">
                    <span class="contact-label">Регистрация</span>
                    <span id="profile-created">—</span>
                </div>
            </div>
            <form id="form-profile">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" id="profile-email">
                </div>
                <div class="form-group">
                    <label>Новый пароль</label>
                    <input type="password" name="password" placeholder="Оставьте пустым чтобы не менять">
                </div>
                <button class="btn btn-primary">Сохранить</button>
            </form>
        </div>

        <div class="card">
            <h2>Опасная зона</h2>
            <p style="font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.7">
                Удаление аккаунта необратимо.<br>Все данные будут потеряны.
            </p>
            <button id="btn-delete" class="btn btn-danger">Удалить аккаунт</button>
        </div>
    </div>
</div>

<footer>
    <div class="footer-inner">
        <div class="footer-studio">ТАНЦЕВАЛЬНАЯ СТУДИЯ · КАЗАНЬ</div>
        <div class="footer-year">© <span id="footer-year"></span></div>
    </div>
</footer>

<script type="module">
import { api } from "./js/api.js";
import { requireAuth, clearTokens, renderNav, showAlert, showConfirm } from "./js/utils.js";

requireAuth();
renderNav([], [{href: './', text: 'Главная'}]);

// Добавляем «Выйти» только на странице профиля
const navAuth = document.querySelector('.nav-auth');
if (navAuth) {
    const a = document.createElement('a');
    a.href = '#';
    a.textContent = 'Выйти';
    a.style.color = 'rgba(220,50,50,0.7)';
    a.addEventListener('click', async e => {
        e.preventDefault();
        await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'include' }).catch(() => {});
        clearTokens();
        window.location.href = 'auth';
    });
    navAuth.appendChild(a);
}

window.addEventListener('scroll', () => {
    document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 60);
});

document.getElementById('footer-year').textContent = new Date().getFullYear();

const container = document.querySelector('.container');
const roleLabels = { user: 'Пользователь', admin: 'Администратор' };

api.getMe().then(user => {
    document.getElementById('profile-email').value = user.email ?? '';
    document.getElementById('profile-role').textContent = roleLabels[user.role] ?? user.role;
    document.getElementById('profile-created').textContent =
        new Date(user.created_at).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    document.getElementById('profile-meta').style.display = 'block';
}).catch(err => showAlert(container, err.message));

document.getElementById('form-profile').addEventListener('submit', async e => {
    e.preventDefault();
    const body = {};
    const email    = e.target.email.value.trim();
    const password = e.target.password.value;
    if (email)    body.email    = email;
    if (password) body.password = password;
    if (!Object.keys(body).length) return;
    try {
        await api.updateMe(body);
        showAlert(container, 'Профиль обновлён', 'success');
        e.target.password.value = '';
    } catch (err) {
        showAlert(container, err.message);
    }
});

document.getElementById('btn-delete').addEventListener('click', async () => {
    if (!await showConfirm('Аккаунт будет удалён безвозвратно. Это действие нельзя отменить.', 'Удалить аккаунт?')) return;
    try {
        await api.deleteMe();
        clearTokens();
        window.location.href = 'auth';
    } catch (err) {
        showAlert(container, err.message);
    }
});
</script>
</body>
</html>
