<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание — Админ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="visibility:hidden">

<nav id="nav"></nav>

<div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-content">

<div class="admin-tabs" id="tabs" style="margin-bottom:1.5rem">
            <button class="admin-tab active" data-tab="events">Занятия</button>
            <button class="admin-tab" data-tab="templates">Шаблон</button>
        </div>

        <!-- ===== ЗАНЯТИЯ ===== -->
        <div id="tab-events">
            <div class="admin-toolbar">
                <button class="btn btn-secondary" id="prev-week">&#8592;</button>
                <div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:190px;flex-shrink:0">
                    <span class="schedule-week-label" id="week-label"></span>
                    <button class="btn btn-secondary" id="current-week-btn" style="font-size:0.72rem;padding:0.2rem 0.9rem;visibility:hidden;white-space:nowrap">Текущая неделя</button>
                </div>
                <button class="btn btn-secondary" id="next-week">&#8594;</button>
                <button class="btn btn-primary" id="apply-template-btn" style="margin-left:auto;white-space:nowrap">Использовать шаблон</button>
                <button class="btn btn-danger" id="clear-week-btn" style="white-space:nowrap">Очистить неделю</button>
            </div>
            <div id="events-alert"></div>
            <div class="schedule-grid" id="events-list"></div>
        </div>

        <!-- ===== ШАБЛОН ===== -->
        <div id="tab-templates" style="display:none">
            <div id="templates-alert"></div>
            <div class="schedule-grid" id="templates-list"></div>
        </div>

    </div>
</div>

<!-- ===== Модалка: занятие ===== -->
<div class="modal-overlay hidden" id="event-modal">
    <div class="modal-box" style="max-width:520px">
        <button class="modal-close" id="event-modal-close">✕</button>
        <div class="modal-title" id="event-modal-title">Занятие</div>
        <div id="event-modal-alert"></div>
        <form id="event-form">
            <div class="form-group" id="ev-tpl-wrap">
                <label class="form-label">Из шаблона (необязательно)</label>
                <select class="form-input" id="ev-template">
                    <option value="">— без шаблона —</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Направление</label>
                <select class="form-input" name="style_id" required id="ev-style"></select>
            </div>
            <div class="form-group">
                <label class="form-label">Преподаватель</label>
                <select class="form-input" name="teacher_id" required id="ev-teacher"></select>
            </div>
            <div class="form-group">
                <label class="form-label">Замена преподавателя (необязательно)</label>
                <select class="form-input" name="substitute_teacher_id" id="ev-sub">
                    <option value="">— нет замены —</option>
                </select>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
                <div class="form-group">
                    <label class="form-label">Дата</label>
                    <input class="form-input" type="date" name="event_date" required id="ev-date">
                </div>
                <div class="form-group">
                    <label class="form-label">Начало</label>
                    <input class="form-input" type="time" name="time_start" required id="ev-time">
                </div>
                <div class="form-group">
                    <label class="form-label">Длительность, мин</label>
                    <input class="form-input" type="number" name="duration_minutes" value="60" min="15" max="240" id="ev-dur">
                </div>
                <div class="form-group">
                    <label class="form-label">Мест максимум</label>
                    <input class="form-input" type="number" name="max_students" value="8" min="1" max="50" id="ev-max">
                </div>
            </div>
            <div class="form-group" id="ev-status-wrap" style="display:none">
                <label class="form-label">Статус</label>
                <select class="form-input" name="status" id="ev-status">
                    <option value="запланировано">Запланировано</option>
                    <option value="отменено">Отменено</option>
                </select>
            </div>
            <div style="display:flex;gap:0.75rem;justify-content:flex-end;margin-top:1rem">
                <button type="button" class="btn btn-secondary" id="event-modal-cancel">Отмена</button>
                <button type="submit" class="btn btn-primary" id="event-submit-btn">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<!-- ===== Модалка: шаблон ===== -->
<div class="modal-overlay hidden" id="tpl-modal">
    <div class="modal-box" style="max-width:520px">
        <button class="modal-close" id="tpl-modal-close">✕</button>
        <div class="modal-title" id="tpl-modal-title">Шаблон</div>
        <div id="tpl-modal-alert"></div>
        <form id="tpl-form">
            <div class="form-group">
                <label class="form-label">Направление</label>
                <select class="form-input" name="style_id" required id="tpl-style"></select>
            </div>
            <div class="form-group">
                <label class="form-label">Преподаватель</label>
                <select class="form-input" name="teacher_id" required id="tpl-teacher"></select>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
                <div class="form-group">
                    <label class="form-label">День недели</label>
                    <select class="form-input" name="day_of_week" required id="tpl-day">
                        <option value="0">Понедельник</option>
                        <option value="1">Вторник</option>
                        <option value="2">Среда</option>
                        <option value="3">Четверг</option>
                        <option value="4">Пятница</option>
                        <option value="5">Суббота</option>
                        <option value="6">Воскресенье</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Начало</label>
                    <input class="form-input" type="time" name="time_start" required id="tpl-time">
                </div>
                <div class="form-group">
                    <label class="form-label">Длительность, мин</label>
                    <input class="form-input" type="number" name="duration_minutes" value="60" min="15" max="240">
                </div>
                <div class="form-group">
                    <label class="form-label">Мест максимум</label>
                    <input class="form-input" type="number" name="max_students" value="8" min="1" max="50">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Статус</label>
                <select class="form-input" id="tpl-active">
                    <option value="true">Активен</option>
                    <option value="false">Неактивен</option>
                </select>
            </div>
            <div style="display:flex;gap:0.75rem;justify-content:flex-end;margin-top:1rem">
                <button type="button" class="btn btn-secondary" id="tpl-modal-cancel">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<script type="module">
import { api } from "../js/api.js";
import { requireAdmin, hideUntilReady, renderNav, renderSidebar, showAlert, showConfirm } from "../js/utils.js";

hideUntilReady();
requireAdmin();
renderNav();
renderSidebar();

const MONTHS_SHORT = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const DAY_NAMES    = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const DAY_ABBR     = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function toISO(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getMonday(d) {
    const date = new Date(d); const day = date.getDay() || 7;
    date.setDate(date.getDate() - day + 1); date.setHours(0,0,0,0); return date;
}

// ── Shared data ──────────────────────────────────────
let styles = [], teachers = [], templates = [];
let currentMonday = getMonday(new Date());
let weekEvents = [];
let editingEventId = null;
let editingTplId   = null;

async function loadShared() {
    [styles, teachers, templates] = await Promise.all([api.getStyles(), api.getTeachers(), api.getTemplates()]);
}

function populateSelect(sel, items, valueFn, labelFn, extra = '') {
    sel.innerHTML = extra + items.map(i =>
        `<option value="${valueFn(i)}">${labelFn(i)}</option>`).join('');
}

// ── Tabs ─────────────────────────────────────────────
document.querySelectorAll('.admin-tab').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.getElementById('tab-events').style.display    = tab === 'events'    ? '' : 'none';
        document.getElementById('tab-templates').style.display = tab === 'templates' ? '' : 'none';
        if (tab === 'templates') loadTemplates();
    });
});

// ── Week navigation ───────────────────────────────────
async function loadWeekEvents() {
    const from = toISO(currentMonday);
    const to   = toISO(addDays(currentMonday, 6));
    try {
        weekEvents = await api.getEventsAdmin(from, to);
        renderWeekEvents();
        updateWeekLabel();
    } catch (e) {
        showAlert(document.getElementById('events-alert'), e.message);
    }
}

function renderWeekEvents() {
    const el    = document.getElementById('events-list');
    const today = toISO(new Date());
    el.innerHTML = Array.from({length: 7}, (_, i) => {
        const date    = addDays(currentMonday, i);
        const dateStr = toISO(date);
        const isToday = dateStr === today;
        const dayIdx  = date.getDay() === 0 ? 6 : date.getDay() - 1;
        const sorted  = weekEvents
            .filter(ev => ev.event_date === dateStr)
            .sort((a, b) => a.time_start.localeCompare(b.time_start));
        return `<div class="schedule-day${isToday ? ' schedule-day--today' : ''}">
            <div class="schedule-day-header">
                <span class="schedule-day-name">${DAY_ABBR[i]}</span>
                <span class="schedule-day-date">${date.getDate()} ${MONTHS_SHORT[date.getMonth()]}</span>
            </div>
            <div class="schedule-day-events">
                ${sorted.length ? sorted.map(ev => {
                    const cancelled = ev.status === 'отменено';
                    return `<div class="schedule-event-card${cancelled ? ' schedule-event-card--cancelled' : ''}">
                        <div class="schedule-event-time">${ev.time_start.slice(0,5)}</div>
                        <div class="schedule-event-style">${ev.style_name}</div>
                        <div class="schedule-event-teacher">${ev.teacher_name}${ev.substitute_teacher_name ? ` → ${ev.substitute_teacher_name}` : ''}</div>
                        <div class="schedule-event-meta">
                            <span>${ev.duration_minutes} мин</span>
                            <span>${ev.enrolled_count}/${ev.max_students}</span>
                            ${cancelled ? '<span class="badge badge-cancelled">Отменено</span>' : ''}
                        </div>
                        <div class="schedule-event-card-actions">
                            <button class="btn btn-secondary btn-sm" style="flex:1;font-size:0.65rem;padding:2px 0" onclick="editEvent(${ev.id})">Ред.</button>
                            <button class="btn btn-danger btn-sm"    style="flex:1;font-size:0.65rem;padding:2px 0" onclick="deleteEvent(${ev.id})">Удал.</button>
                        </div>
                    </div>`;
                }).join('') : '<div class="schedule-empty">—</div>'}
            </div>
        </div>`;
    }).join('');
}

const BOOKING_HORIZON_DAYS = 28;

function updateWeekLabel() {
    const end         = addDays(currentMonday, 6);
    const todayMonday = getMonday(new Date());
    const maxMonday   = getMonday(addDays(new Date(), BOOKING_HORIZON_DAYS - 6));

    document.getElementById('week-label').textContent =
        `${currentMonday.getDate()} ${MONTHS_SHORT[currentMonday.getMonth()]} — ` +
        `${end.getDate()} ${MONTHS_SHORT[end.getMonth()]} ${end.getFullYear()}`;

    document.getElementById('prev-week').disabled       = toISO(currentMonday) <= toISO(todayMonday);
    document.getElementById('next-week').disabled       = toISO(addDays(currentMonday, 7)) > toISO(maxMonday);
    document.getElementById('current-week-btn').style.visibility =
        toISO(currentMonday) === toISO(todayMonday) ? 'hidden' : 'visible';
}

document.getElementById('prev-week').addEventListener('click', () => { currentMonday = addDays(currentMonday, -7); loadWeekEvents(); });
document.getElementById('next-week').addEventListener('click', () => { currentMonday = addDays(currentMonday,  7); loadWeekEvents(); });
document.getElementById('current-week-btn').addEventListener('click', () => { currentMonday = getMonday(new Date()); loadWeekEvents(); });

// ── Event modal ───────────────────────────────────────
function openEventModal(ev = null) {
    editingEventId = ev?.id ?? null;
    const isEdit = !!ev;
    document.getElementById('event-modal-title').textContent = isEdit ? 'Редактировать занятие' : 'Новое занятие';
    document.getElementById('ev-status-wrap').style.display  = isEdit ? '' : 'none';
    document.getElementById('ev-tpl-wrap').style.display     = isEdit ? 'none' : '';

    populateSelect(document.getElementById('ev-style'),   styles,   s => s.id, s => s.name);
    populateSelect(document.getElementById('ev-teacher'), teachers, t => t.id, t => t.name);
    populateSelect(document.getElementById('ev-sub'),     teachers, t => t.id, t => t.name, '<option value="">— нет замены —</option>');
    populateSelect(document.getElementById('ev-template'),
        templates.filter(t => t.is_active),
        t => t.id,
        t => `${DAY_NAMES[t.day_of_week]} ${t.time_start.slice(0,5)} — ${t.style_name}`,
        '<option value="">— без шаблона —</option>'
    );

    if (isEdit) {
        document.getElementById('ev-style').value   = ev.style_id;
        document.getElementById('ev-teacher').value = ev.teacher_id;
        document.getElementById('ev-sub').value     = ev.substitute_teacher_id || '';
        document.getElementById('ev-date').value    = ev.event_date;
        document.getElementById('ev-time').value    = ev.time_start.slice(0,5);
        document.getElementById('ev-dur').value     = ev.duration_minutes;
        document.getElementById('ev-max').value     = ev.max_students;
        document.getElementById('ev-status').value  = ev.status;
    } else {
        document.getElementById('event-form').reset();
        document.getElementById('ev-dur').value = 60;
        document.getElementById('ev-max').value = 8;
    }
    document.getElementById('event-modal').classList.remove('hidden');
}

document.getElementById('ev-template').addEventListener('change', function() {
    const tpl = templates.find(t => t.id === +this.value);
    if (!tpl) return;
    document.getElementById('ev-style').value   = tpl.style_id;
    document.getElementById('ev-teacher').value = tpl.teacher_id;
    document.getElementById('ev-time').value    = tpl.time_start.slice(0, 5);
    document.getElementById('ev-dur').value     = tpl.duration_minutes;
    document.getElementById('ev-max').value     = tpl.max_students;
    // Подставить ближайшую дату по дню недели шаблона
    const today = new Date();
    const jsDay = (tpl.day_of_week + 1) % 7; // 0=Пн → JS 1, 6=Вс → JS 0
    const diff  = (jsDay - today.getDay() + 7) % 7;
    const next  = new Date(today);
    next.setDate(today.getDate() + diff);
    document.getElementById('ev-date').value = toISO(next);
});

document.getElementById('event-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('event-submit-btn');
    btn.disabled = true;
    const fd = new FormData(e.target);

    try {
        if (editingEventId) {
            const data = {};
            const sub = fd.get('substitute_teacher_id');
            data.substitute_teacher_id = sub ? +sub : null;
            data.status            = fd.get('status');
            data.time_start        = fd.get('time_start');
            data.duration_minutes  = +fd.get('duration_minutes');
            data.max_students      = +fd.get('max_students');
            await api.updateEvent(editingEventId, data);
        } else {
            const sub = fd.get('substitute_teacher_id');
            await api.createEvent({
                style_id:           +fd.get('style_id'),
                teacher_id:         +fd.get('teacher_id'),
                substitute_teacher_id: sub ? +sub : null,
                event_date:         fd.get('event_date'),
                time_start:         fd.get('time_start'),
                duration_minutes:   +fd.get('duration_minutes'),
                max_students:       +fd.get('max_students'),
            });
        }
        document.getElementById('event-modal').classList.add('hidden');
        await loadWeekEvents();
    } catch (err) {
        showAlert(document.getElementById('event-modal-alert'), err.message);
    } finally { btn.disabled = false; }
});

window.editEvent = id => openEventModal(weekEvents.find(e => e.id === id));

window.deleteEvent = async id => {
    if (!await showConfirm('Удалить занятие? Все записи студентов будут также удалены.', 'Удаление занятия')) return;
    try { await api.deleteEvent(id); await loadWeekEvents(); }
    catch (e) { showAlert(document.getElementById('events-alert'), e.message); }
};

document.getElementById('apply-template-btn').addEventListener('click', applyTemplates);
document.getElementById('event-modal-close').addEventListener('click',   () => document.getElementById('event-modal').classList.add('hidden'));
document.getElementById('event-modal-cancel').addEventListener('click',  () => document.getElementById('event-modal').classList.add('hidden'));

// ── Templates ─────────────────────────────────────────
async function loadTemplates() {
    try {
        const templates = await api.getTemplates();
        renderTemplates(templates);
    } catch (e) {
        showAlert(document.getElementById('templates-alert'), e.message);
    }
}

function renderTemplates(tpls) {
    const el = document.getElementById('templates-list');
    const byDay = Array.from({length: 7}, () => []);
    tpls.forEach(t => byDay[t.day_of_week].push(t));
    el.innerHTML = DAY_NAMES.map((day, i) => {
        const sorted = byDay[i].sort((a, b) => a.time_start.localeCompare(b.time_start));
        return `<div class="schedule-day">
            <div class="schedule-day-header">
                <span class="schedule-day-name">${DAY_ABBR[i]}</span>
                <span class="schedule-day-date">${day}</span>
            </div>
            <div class="schedule-day-events">
                ${sorted.map(t => `
                    <div class="schedule-event-card${!t.is_active ? ' schedule-event-card--cancelled' : ''}">
                        <div class="schedule-event-time">${t.time_start.slice(0,5)}</div>
                        <div class="schedule-event-style">${t.style_name}</div>
                        <div class="schedule-event-teacher">${t.teacher_name}</div>
                        <div class="schedule-event-meta">
                            <span>${t.duration_minutes} мин</span>
                            <span>макс. ${t.max_students}</span>
                            ${!t.is_active ? '<span class="badge badge-cancelled">Выкл</span>' : ''}
                        </div>
                        <div class="schedule-event-card-actions">
                            <button class="btn btn-secondary btn-sm" style="flex:1;font-size:0.65rem;padding:2px 0" onclick="editTemplate(${t.id})">Ред.</button>
                            <button class="btn btn-danger btn-sm"    style="flex:1;font-size:0.65rem;padding:2px 0" onclick="deleteTemplate(${t.id})">Удал.</button>
                        </div>
                    </div>
                `).join('')}
                <button class="btn btn-secondary schedule-event-btn" style="font-size:0.7rem;margin-top:4px" onclick="addTemplateForDay(${i})">+ Добавить</button>
            </div>
        </div>`;
    }).join('');
    window._templates = tpls;
}

window.addTemplateForDay = function(day) {
    openTplModal(null, day);
};

function openTplModal(tpl = null, defaultDay = null) {
    editingTplId = tpl?.id ?? null;
    document.getElementById('tpl-modal-title').textContent = tpl ? 'Редактировать шаблон' : 'Новый шаблон';
    populateSelect(document.getElementById('tpl-style'),   styles,   s => s.id, s => s.name);
    populateSelect(document.getElementById('tpl-teacher'), teachers, t => t.id, t => t.name);
    if (tpl) {
        document.getElementById('tpl-style').value   = tpl.style_id;
        document.getElementById('tpl-teacher').value = tpl.teacher_id;
        document.getElementById('tpl-day').value     = tpl.day_of_week;
        document.getElementById('tpl-time').value    = tpl.time_start.slice(0,5);
        document.getElementById('tpl-form').elements['duration_minutes'].value = tpl.duration_minutes;
        document.getElementById('tpl-form').elements['max_students'].value     = tpl.max_students;
        document.getElementById('tpl-active').value = String(tpl.is_active);
    } else {
        document.getElementById('tpl-form').reset();
        document.getElementById('tpl-form').elements['duration_minutes'].value = 60;
        document.getElementById('tpl-form').elements['max_students'].value     = 8;
        document.getElementById('tpl-active').value = 'true';
        if (defaultDay !== null) document.getElementById('tpl-day').value = defaultDay;
    }
    document.getElementById('tpl-modal').classList.remove('hidden');
}

document.getElementById('tpl-form').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = {
        style_id:         +fd.get('style_id'),
        teacher_id:       +fd.get('teacher_id'),
        day_of_week:      +fd.get('day_of_week'),
        time_start:       fd.get('time_start'),
        duration_minutes: +fd.get('duration_minutes'),
        max_students:     +fd.get('max_students'),
        is_active:        document.getElementById('tpl-active').value === 'true',
    };
    try {
        if (editingTplId) await api.updateTemplate(editingTplId, data);
        else              await api.createTemplate(data);
        document.getElementById('tpl-modal').classList.add('hidden');
        await loadTemplates();
    } catch (err) {
        showAlert(document.getElementById('tpl-modal-alert'), err.message);
    }
});

window.editTemplate = id => openTplModal(window._templates?.find(t => t.id === id));

window.deleteTemplate = async id => {
    if (!await showConfirm('Удалить шаблон расписания?', 'Удаление шаблона')) return;
    try { await api.deleteTemplate(id); await loadTemplates(); }
    catch (e) { showAlert(document.getElementById('templates-alert'), e.message); }
};

document.getElementById('tpl-modal-close').addEventListener('click',  () => document.getElementById('tpl-modal').classList.add('hidden'));
document.getElementById('tpl-modal-cancel').addEventListener('click', () => document.getElementById('tpl-modal').classList.add('hidden'));

// ── Clear week ───────────────────────────────────────
document.getElementById('clear-week-btn').addEventListener('click', async () => {
    if (!weekEvents.length) {
        showAlert(document.getElementById('events-alert'), 'На этой неделе нет занятий');
        return;
    }
    if (!await showConfirm(`Удалить все ${weekEvents.length} занятий этой недели? Записи студентов также будут удалены.`, 'Очистить неделю')) return;

    const btn = document.getElementById('clear-week-btn');
    btn.disabled = true;
    for (const ev of weekEvents) {
        try { await api.deleteEvent(ev.id); } catch {}
    }
    btn.disabled = false;
    await loadWeekEvents();
    showAlert(document.getElementById('events-alert'), 'Неделя очищена', 'success');
});

// ── Apply template ────────────────────────────────────
async function applyTemplates() {
    const active = templates.filter(t => t.is_active);
    if (!active.length) {
        showAlert(document.getElementById('events-alert'), 'Нет активных шаблонов. Сначала создайте шаблон.');
        return;
    }

    const btn = document.getElementById('apply-template-btn');
    btn.disabled = true;

    let created = 0, skipped = 0;
    for (const tpl of active) {
        const eventDate = toISO(addDays(currentMonday, tpl.day_of_week));
        const exists = weekEvents.some(ev =>
            ev.template_id === tpl.id && ev.event_date === eventDate
        );
        if (exists) { skipped++; continue; }
        try {
            await api.createEvent({
                style_id:         tpl.style_id,
                teacher_id:       tpl.teacher_id,
                event_date:       eventDate,
                time_start:       tpl.time_start,
                duration_minutes: tpl.duration_minutes,
                max_students:     tpl.max_students,
                template_id:      tpl.id,
            });
            created++;
        } catch {}
    }

    btn.disabled = false;
    await loadWeekEvents();

    const msg = created
        ? `Создано занятий: ${created}${skipped ? `, уже было: ${skipped}` : ''}`
        : `Все занятия на эту неделю уже существуют`;
    showAlert(document.getElementById('events-alert'), msg, created ? 'success' : 'error');
}

// ── Init ─────────────────────────────────────────────
await loadShared();
await loadWeekEvents();
</script>
