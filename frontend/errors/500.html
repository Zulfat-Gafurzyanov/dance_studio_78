<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Ошибка сервера</title>
    <link rel="stylesheet" href="/errors/errors.css">
    <style>
        body {
            background: radial-gradient(ellipse 70% 70% at 50% 30%,
                #110d24, var(--black));
        }

        .stage-light {
            position: fixed; z-index: 0; pointer-events: none;
            top: -80px; left: 50%; transform: translateX(-50%);
            width: 3px; height: 45vh;
            background: linear-gradient(to bottom, var(--gold), transparent);
            box-shadow: 0 0 60px 40px rgba(196,168,112,.06);
            animation: flicker 0.15s infinite;
        }

        .stage-cone {
            position: fixed; z-index: 0; pointer-events: none;
            top: 0; left: 50%; transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 15vw solid transparent;
            border-right: 15vw solid transparent;
            border-top: 45vh solid rgba(196,168,112,.04);
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0%   { opacity: 1; }
            15%  { opacity: .6; }
            25%  { opacity: 1; }
            50%  { opacity: .4; }
            55%  { opacity: 1; }
            70%  { opacity: .8; }
            80%  { opacity: 1; }
            90%  { opacity: .5; }
            95%  { opacity: 1; }
        }

        .error-code {
            color: var(--gold);
            text-shadow: 0 0 80px rgba(196,168,112,.3);
            animation: flicker 0.15s infinite;
        }

        .shoe {
            font-size: 60px; margin-bottom: 12px; display: block;
            animation: stumble 1s cubic-bezier(.36,.07,.19,.97) both;
            transform-origin: bottom center;
        }
        @keyframes stumble {
            0%   { transform: rotate(0deg) translateY(0); }
            25%  { transform: rotate(-15deg) translateY(-6px); }
            50%  { transform: rotate(10deg) translateY(4px); }
            75%  { transform: rotate(-5deg) translateY(-2px); }
            100% { transform: rotate(8deg) translateY(0); }
        }

        .error-label { color: var(--gold); opacity: .6; }
        .error-title { color: var(--gold); }

        .btn-home {
            background: var(--gold); color: var(--black);
            font-weight: 700;
        }
        .btn-home:hover { background: var(--red); color: #fff; }

        .crack {
            width: 180px; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 20px auto 28px;
            opacity: .5;
        }
    </style>
</head>
<body>
    <div class="stage-light"></div>
    <div class="stage-cone"></div>
    <div class="bg-noise"></div>

    <div class="content">
        <span class="shoe">🩰</span>
        <div class="error-label">Ошибка сервера</div>
        <div class="error-code">500</div>
        <div class="crack"></div>
        <div class="error-title">Что-то пошло не так</div>
        <p class="error-desc">На нашей стороне возникла ошибка. Мы уже разбираемся. Вернитесь чуть позже, чтобы продолжить запись на занятия.</p>
        <a href="../" class="btn-home">← На главную</a>
    </div>
</body>
</html>
