<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена</title>
    <link rel="stylesheet" href="/errors/errors.css">
    <style>
        /* Танцор потерялся на танцполе */
        body { background: var(--black); }

        .grid-bg {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            from { background-position: 0 0; }
            to   { background-position: 60px 60px; }
        }

        .spotlight {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background: radial-gradient(ellipse 55% 60% at 50% 50%,
                rgba(232,0,61,.06) 0%, transparent 70%);
            animation: spotlightPulse 4s ease-in-out infinite;
        }
        @keyframes spotlightPulse {
            0%, 100% { opacity: .6; }
            50%       { opacity: 1; }
        }

        .error-code {
            color: transparent;
            -webkit-text-stroke: 2px rgba(255,184,0,.35);
            position: relative;
        }
        .error-code::after {
            content: '404';
            position: absolute; inset: 0;
            color: var(--red);
            -webkit-text-stroke: 0;
            animation: glitch 3.5s infinite;
            clip-path: polygon(0 30%, 100% 30%, 100% 55%, 0 55%);
        }
        @keyframes glitch {
            0%, 90%, 100% { transform: translateX(0); opacity: 0; }
            91%  { transform: translateX(-6px); opacity: 1; }
            93%  { transform: translateX(6px);  opacity: 1; }
            95%  { transform: translateX(-3px); opacity: 1; }
            97%  { transform: translateX(3px);  opacity: 1; }
            99%  { transform: translateX(0);    opacity: 0; }
        }

        .dancer {
            font-size: 64px;
            animation: dance 1.8s ease-in-out infinite;
            display: block; margin-bottom: 16px;
            filter: drop-shadow(0 0 20px rgba(232,0,61,.5));
        }
        @keyframes dance {
            0%, 100% { transform: rotate(-8deg) translateY(0); }
            25%       { transform: rotate(8deg)  translateY(-8px); }
            50%       { transform: rotate(-4deg) translateY(0); }
            75%       { transform: rotate(4deg)  translateY(-4px); }
        }

        .btn-home {
            background: var(--red); color: #fff;
            border: none;
        }
        .btn-home:hover { background: var(--red); }

        .divider {
            width: 50px; height: 2px;
            background: linear-gradient(90deg, var(--red), var(--red));
            margin: 0 auto 28px;
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="spotlight"></div>
    <div class="bg-noise"></div>

    <div class="content">
        <span class="dancer">💃</span>
        <div class="error-label">Ошибка</div>
        <div class="error-code">404</div>
        <div class="divider"></div>
        <div class="error-title">Страница потерялась на танцполе</div>
        <p class="error-desc">Кажется, эта страница ушла импровизировать и не вернулась. Попробуй начать сначала.</p>
        <a href="../" class="btn-home">← На главную</a>
    </div>
</body>
</html>
