<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>503 — Техническое обслуживание</title>
    <link rel="stylesheet" href="errors.css">
    <style>
        /* Студия на репетиции */
        body {
            background: radial-gradient(ellipse 80% 60% at 50% 0%,
                #050d14, var(--black));
        }

        .vinyl {
            width: 120px; height: 120px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 50%, #333 18%, transparent 18%),
                repeating-conic-gradient(#1a1a1a 0deg, #222 2deg, #1a1a1a 4deg);
            box-shadow: 0 0 0 3px #333, 0 0 40px rgba(255,107,0,.2);
            margin-bottom: 32px;
            animation: spin 4s linear infinite;
            position: relative;
        }
        .vinyl::after {
            content: '';
            position: absolute; inset: 38%;
            border-radius: 50%;
            background: var(--red);
            box-shadow: 0 0 16px rgba(123,94,167,.6);
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .error-code {
            background: linear-gradient(135deg, var(--red), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .progress-wrap {
            width: 320px; max-width: 85vw;
            margin: 24px 0 32px;
        }
        .progress-label {
            display: flex; justify-content: space-between;
            font-size: 10px; font-weight: 700; letter-spacing: 2px;
            text-transform: uppercase; color: var(--muted);
            margin-bottom: 10px;
        }
        .progress-bar {
            height: 3px;
            background: rgba(255,255,255,.08);
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--red), var(--gold));
            animation: loading 3s ease-in-out infinite;
            width: 0;
        }
        @keyframes loading {
            0%   { width: 0%;   opacity: 1; }
            70%  { width: 100%; opacity: 1; }
            90%  { width: 100%; opacity: 0; }
            100% { width: 0%;   opacity: 0; }
        }

        .btn-home {
            background: transparent;
            color: var(--red);
            border: 1px solid rgba(123,94,167,.4);
        }
        .btn-home:hover {
            background: var(--red); color: #fff;
            border-color: var(--red);
        }

        .dots {
            display: inline-flex; gap: 6px; margin-left: 4px;
            vertical-align: middle;
        }
        .dots span {
            width: 5px; height: 5px; border-radius: 50%;
            background: var(--red); display: inline-block;
            animation: blink 1.2s infinite;
        }
        .dots span:nth-child(2) { animation-delay: .2s; }
        .dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes blink {
            0%, 80%, 100% { opacity: .2; }
            40%            { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="bg-noise"></div>

    <div class="content">
        <div class="vinyl"></div>
        <div class="error-label">Техническое обслуживание</div>
        <div class="error-code">503</div>
        <div class="error-title">Студия на репетиции</div>
        <p class="error-desc">
            Мы готовим кое-что особенное. Скоро вернёмся
            <span class="dots"><span></span><span></span><span></span></span>
        </p>
        <div class="progress-wrap">
            <div class="progress-label">
                <span>Загрузка</span><span>Уже скоро</span>
            </div>
            <div class="progress-bar"><div class="progress-fill"></div></div>
        </div>
        <a href="../" class="btn-home">← На главную</a>
    </div>
</body>
</html>
