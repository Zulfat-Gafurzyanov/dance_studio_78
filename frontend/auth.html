<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Студия 78</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav id="nav"></nav>

<div class="auth-wrap">
    <div class="auth-box">
        <h1>СЕМЬ<span>-ВОСЕМЬ</span></h1>
        <div class="auth-subtitle">Студия танцев Семь-Восемь</div>

        <div class="card">
            <div class="tab-row">
                <div class="tab active" data-form="signin">Войти</div>
                <div class="tab" data-form="signup">Регистрация</div>
            </div>

            <form id="form-signin">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" name="password" required>
                </div>
                <button class="btn btn-primary" style="width:100%">Войти</button>
            </form>

            <form id="form-signup" style="display:none">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" name="password" required minlength="8">
                </div>
                <div class="form-group">
                    <label>Подтверждение пароля</label>
                    <input type="password" name="password_confirm" required minlength="8">
                </div>
                <button class="btn btn-primary" style="width:100%">Создать аккаунт</button>
            </form>
        </div>
    </div>
</div>

<script type="module">
import { api } from "./js/api.js";
import { setTokens, isLoggedIn, renderNav, showAlert } from "./js/utils.js";

if (isLoggedIn()) window.location.href = "index.html";

renderNav();

// Tabs
document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById("form-signin").style.display = tab.dataset.form === "signin" ? "block" : "none";
        document.getElementById("form-signup").style.display = tab.dataset.form === "signup" ? "block" : "none";
    });
});

document.getElementById("form-signin").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
        const data = await api.signIn(e.target.email.value, e.target.password.value);
        setTokens(data.access_token, data.refresh_token);
        window.location.href = "index.html";
    } catch (err) {
        showAlert(e.target, err.message);
    }
});

document.getElementById("form-signup").addEventListener("submit", async (e) => {
    e.preventDefault();
    const password = e.target.password.value;
    const password_confirm = e.target.password_confirm.value;
    if (password !== password_confirm) {
        showAlert(e.target, "Пароли не совпадают");
        return;
    }
    try {
        await api.signUp(e.target.email.value, password, password_confirm);
        showAlert(e.target, "Аккаунт создан! Войдите.", "success");
    } catch (err) {
        showAlert(e.target, err.message);
    }
});
</script>
</body>
</html>
